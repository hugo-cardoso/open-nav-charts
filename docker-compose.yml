services:
  postgres:
    image: postgres:17-alpine
    container_name: onc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: onc
      POSTGRES_PASSWORD: onc
      POSTGRES_DB: onc
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onc -d onc"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: onc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cria o bucket na subida do ambiente e encerra. Sem ele, a rotina falharia
  # no primeiro arquivamento por bucket inexistente (FR-029).
  minio-bucket:
    image: minio/mc:latest
    container_name: onc-minio-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/onc-charts &&
      echo 'bucket onc-charts pronto'
      "

volumes:
  postgres-data:
  minio-data:
